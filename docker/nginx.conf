server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API, on the same origin as the site, so the session cookie just works.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr; # the API reads this when TRUST_PROXY=true
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m; # videos go straight to storage, never through here
  }

  # The SDK is meant to be loaded from other people's websites.
  location /sdk/ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  # Build output has content hashes in its names, so it can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Everything else is a page of the single-page app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
