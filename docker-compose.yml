# Local development infrastructure. The apps themselves run on your machine (npm run dev:*).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vidcraft
      POSTGRES_PASSWORD: vidcraft
      POSTGRES_DB: vidcraft
    ports: ["5442:5432"] # 5442 on the host so it doesn't clash with a locally installed Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vidcraft"]
      interval: 2s
      retries: 15

  # S3-compatible object storage; stands in for Cloudflare R2 locally.
  # (MinIO stopped publishing free Docker images, so SeaweedFS is used instead.)
  storage:
    image: chrislusf/seaweedfs:4.55
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      retries: 30

  # One-shot: creates the buckets, then exits.
  #   vidcraft        private: originals and tool outputs (signed URLs only)
  #   vidcraft-media  public read: streamable video the player fetches directly
  storage-init:
    image: chrislusf/seaweedfs:4.55
    depends_on:
      storage: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - sleep 3 && printf 's3.bucket.create -name vidcraft\ns3.bucket.create -name vidcraft-media\n' | weed shell -master=storage:9333

volumes:
  pgdata:
  storagedata:
